plugins {
    id 'com.android.application'
}

def releaseStore = System.getenv('PHOTOCRAFT_KEYSTORE')
def releaseStorePassword = System.getenv('PHOTOCRAFT_STORE_PASSWORD')
def releaseAlias = System.getenv('PHOTOCRAFT_KEY_ALIAS')
def releaseKeyPassword = System.getenv('PHOTOCRAFT_KEY_PASSWORD')
def signedRelease = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }

android {
    namespace 'ai.storyteller.photocraft'
    compileSdk 35

    defaultConfig {
        applicationId "ai.storyteller.photocraft"
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName "0.7.0-android-alpha.3"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (signedRelease) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signedRelease) signingConfig signingConfigs.release
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
}