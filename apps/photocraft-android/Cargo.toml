[package]
name = "photocraft-android"
description = "PhotoCraft for Android (eframe/wgpu, Vulkan)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
name = "photocraft_android"
crate-type = ["cdylib"]

[dependencies]
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
photocraft-tablet = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.14"